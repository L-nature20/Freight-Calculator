name: Build Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pyinstaller
          # 验证关键依赖
          python -c "import webview; print('webview OK:', webview.__file__)" || exit 1
          python -c "import clr; print('pythonnet OK:', clr.__file__)" || exit 1

      - name: Build exe
        run: python build.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Freight Calculator ${{ github.ref_name }}
          body: |
            ## 更新内容

            请下载 `运费试算工具.exe`，替换旧版本即可。

            启动后会自动检查新版本。
          files: |
            dist/运费试算工具.exe
            dist/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
